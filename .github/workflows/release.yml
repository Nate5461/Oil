name: Build and release

# Every push builds oilApp.exe on Windows and checks it runs.
# Pushing a v* tag (or creating a release with a new v* tag on GitHub) also publishes it as a release.
on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build oilApp.exe
        run: |
          python -m pip install -r requirements.txt
          python -m PyInstaller --noconfirm oilApp.spec

      - name: Check the exe runs from an empty folder
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\fresh"
          Copy-Item dist\oilApp.exe $dir
          Start-Process -FilePath "$dir\oilApp.exe" -WorkingDirectory $dir
          try {
            $up = $false
            foreach ($i in 1..120) {
              try { Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $up) { throw 'oilApp.exe never served the home page' }
            if (-not (Test-Path "$dir\oil_data.sqlite")) { throw 'oil_data.sqlite was not created next to the exe' }
            # /data reports failures as {"error": ...} with a 200, so check for the expected list of rows
            $rows = Invoke-RestMethod http://127.0.0.1:8080/data -Method Post -ContentType 'application/json' -Body '{"date":"2000-01-10"}'
            if ($rows.Count -lt 1 -or -not $rows[0].CloseDate) { throw "/data returned: $($rows | ConvertTo-Json -Compress)" }
            Write-Host "OK: home page served, database created, /data returned $($rows.Count) rows"
          } finally {
            Get-Process oilApp -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Upload exe for testing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: oilApp
          path: dist/oilApp.exe
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Exit codes are checked by hand: "release view" failing just means the release doesn't exist yet
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $notesFile = "$env:RUNNER_TEMP\notes.md"
          (Get-Content .github/release-notes.md -Raw).Replace('{{REPO}}', $env:GITHUB_REPOSITORY).Replace('{{TAG}}', $tag) | Set-Content $notesFile
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/oilApp.exe --title "Oil App $tag" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            # Release was created on github.com along with the tag: attach the exe, and fill in notes if left blank
            gh release upload $tag dist/oilApp.exe --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
            if (-not (gh release view $tag --json body -q .body)) {
              gh release edit $tag --notes-file $notesFile
              if ($LASTEXITCODE -ne 0) { exit 1 }
            }
          }
